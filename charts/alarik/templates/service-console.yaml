apiVersion: v1
kind: Service
metadata:
  name: {{ include "alarik.fullname" . }}-console
  labels:
    {{- include "alarik.labels" . | nindent 4 }}
    {{- include "alarik.consoleSelectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "alarik.consoleSelectorLabels" . | nindent 4 }}
