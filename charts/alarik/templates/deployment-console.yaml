apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alarik.fullname" . }}-console
  labels:
    {{- include "alarik.labels" . | nindent 4 }}
    {{- include "alarik.consoleSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "alarik.consoleSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.console.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "alarik.labels" . | nindent 8 }}
        {{- include "alarik.consoleSelectorLabels" . | nindent 8 }}
        {{- with .Values.console.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NUXT_PUBLIC_API_BASE_URL
              value: {{ .Values.alarik.apiBaseUrl | quote }}
            - name: NUXT_PUBLIC_CONSOLE_BASE_URL
              value: {{ .Values.alarik.consoleBaseUrl | quote }}
            - name: NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION
              value: {{ .Values.alarik.allowAccountCreation | quote }}
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
