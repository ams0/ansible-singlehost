  services:
    # Backend service pointing to localhost:30963 on the host
    backend-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:30963"

    # Omni requires HTTP/2 (h2c) for GRPC communication
    omni-h2c-service:
      loadBalancer:
        servers:
          - url: "h2c://host.docker.internal:30963"