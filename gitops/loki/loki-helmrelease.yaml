---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
  labels:
    app: loki
spec:
  interval: 10m
  timeout: 10m
  targetNamespace: logging
  chart:
    spec:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SimpleScalable

    loki:
      auth_enabled: false
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      ingester:
        chunk_encoding: snappy
      tracing:
        enabled: false
      querier:
        max_concurrent: 2
      limits_config:
        retention_period: 72h        # 3 days — keep MinIO disk usage bounded
        allow_structured_metadata: true
        volume_enabled: true
      compactor:
        retention_enabled: true
        working_directory: /var/loki/compactor
        compaction_interval: 10m
        delete_request_store: filesystem
      storage:
        type: s3
        s3:
          endpoint: loki-minio:9000
          insecure: true
          s3ForcePathStyle: true
      commonConfig:
        replication_factor: 1
      resultsCache:
        enabled: false
      chunksCache:
        enabled: false

    # Simple scalable components — single replica for single-node
    backend:
      replicas: 1
      persistence:
        storageClass: local-path
        size: 10Gi
    read:
      replicas: 1
      persistence:
        storageClass: local-path
        size: 10Gi
    write:
      replicas: 1
      persistence:
        storageClass: local-path
        size: 10Gi

    # Gateway (nginx) fronts read+write on port 80.
    # Basic auth is required for the public endpoint (loki.vps.kubespaces.cloud).
    # In-cluster collectors write directly to loki-write:3100 and bypass auth.
    # Create the htpasswd secret manually before reconcile:
    #   htpasswd -nb <user> <pass> | kubectl create secret generic \
    #     loki-gateway-auth -n logging --from-file=.htpasswd=/dev/stdin
    gateway:
      enabled: true
      service:
        type: ClusterIP
        port: 80
      basicAuth:
        enabled: true
        existingSecret: loki-gateway-auth

    # Minio for S3-compatible object storage (required by SimpleScalable)
    minio:
      enabled: true
      persistence:
        storageClass: local-path
        size: 20Gi
      buckets:
        - name: loki-chunks
        - name: loki-index
        - name: loki-logs
        - name: loki-compactor

    # Disable cache sidecars on single-node cluster (resource constraints)
    resultsCache:
      replicas: 0
    chunksCache:
      replicas: 0

    # Zero out microservices mode replicas
    singleBinary:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0

    # Monitoring
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false

    # Disable test pod
    test:
      enabled: false
