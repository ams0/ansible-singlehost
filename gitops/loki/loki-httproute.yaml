---
# Public endpoint for Loki — both read (Grafana, LogCLI) and write (external
# log shippers) traffic. Routes through the nginx loki-gateway, which enforces
# basic auth via the loki-gateway-auth secret.
#
# In-cluster collectors (Alloy DaemonSet) write directly to
# loki-write.logging.svc:3100 and bypass auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: logging
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "loki.vps.kubespaces.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: loki-gateway
          port: 80
