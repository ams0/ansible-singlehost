---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: flux-system
  labels:
    app: clickhouse-operator
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: ">=0.27.0"
      sourceRef:
        kind: HelmRepository
        name: altinity
        namespace: flux-system
      interval: 1h
  targetNamespace: clickhouse-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: clickhouse-operator
