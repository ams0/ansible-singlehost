---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
  labels:
    app: alloy
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: alloy
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana       # shared grafana repo (defined in gitops/loki/)
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # DaemonSet on every node so we can tail /var/log/pods/* host paths
    controller:
      type: daemonset

    alloy:
      # Mount host log paths
      mounts:
        varlog: true
        dockercontainers: true

      configMap:
        # River-style config: discover pods on this node, tail their logs from
        # /var/log/pods, attach k8s metadata as labels, push to Loki internally
        # (bypassing the auth-protected gateway by hitting loki-write directly).
        content: |-
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            // Only tail pods scheduled on this node
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              regex         = sys.env("HOSTNAME")
              action        = "keep"
            }

            // K8s labels for Loki streams
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            // Compute on-disk log path: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.write.default.receiver]
          }

          // Internal Loki write — bypasses auth on the public gateway
          loki.write "default" {
            endpoint {
              url = "http://loki-write.logging.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

    # K8s API access for pod discovery
    rbac:
      create: true
    serviceAccount:
      create: true
