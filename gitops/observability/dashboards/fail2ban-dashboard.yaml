            {"datasource": {"type": "loki", "uid": "loki"}, "editorMode": "code", "expr": "topk(20, sum by (ip) (count_over_time({job=\"fail2ban\"} |~ \"(?i)\\\\sBan\\\\s\" | regexp `(?P<ip>\\\\d+\\\\.\\\\d+\\\\.\\\\d+\\\\.\\\\d+)` [$__range])))", "format": "table", "instant": true, "refId": "A"}
