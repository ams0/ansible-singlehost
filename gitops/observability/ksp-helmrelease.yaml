---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: flux-system
  labels:
    app: prometheus
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: observability
  chartRef:
    kind: OCIRepository
    name: kps-ocirepo
    namespace: flux-system

  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # kube-prometheus-stack configuration for observability namespace
    # Deploys Prometheus with OTLP, Grafana, and Thanos with local storage

    # Global namespace override
    namespaceOverride: "observability"

    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Enable OTLP receiver for OpenTelemetry metrics
        otlp:
          promoteResourceAttributes: []
          keepIdentifyingResourceAttributes: false
          translationStrategy: NoUTF8EscapingWithSuffixes
          convertHistogramsToNHCB: false

        # Retention configuration - 7 days
        retention: 7d
        retentionSize: ""

        # TSDB configuration
        tsdb:
          outOfOrderTimeWindow: 0s
        walCompression: true

        # Thanos sidecar configuration for local storage
        thanos:
          # Enable Thanos sidecar
          image: quay.io/thanos/thanos:v0.34.1
          version: v0.34.1

          # Object storage configuration for local filesystem
          objectStorageConfig:
            name: thanos-objstore-config
            key: thanos.yaml

          # External labels for Thanos
          externalLabels:
            cluster: "kubespaces"
            prometheus_replica: "$(POD_NAME)"

          # Volume mounts for Thanos sidecar
          volumeMounts:
            - name: thanos-store
              mountPath: /thanos/store

        # Volumes for Thanos local storage
        volumes:
          - name: thanos-store
            persistentVolumeClaim:
              claimName: thanos-store

        # Storage configuration for Prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

        # Additional scrape configs if needed
        additionalScrapeConfigs: []

    # Grafana configuration
    grafana:
      enabled: true
      namespaceOverride: "observability"

      # Admin credentials
      adminPassword: "admin"  # Change this in production!

      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC

      # Datasources
      sidecar:
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
          uid: prometheus

      # Grafana ingress disabled (we'll use HTTPRoute instead)
      ingress:
        enabled: false

      # Service configuration
      service:
        type: ClusterIP
        port: 80
        targetPort: 3000

      # Persistence
      persistence:
        enabled: true
        size: 10Gi
        accessModes:
          - ReadWriteOnce

    # Alertmanager configuration
    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    # Prometheus Operator configuration
    prometheusOperator:
      namespaces:
        releaseNamespace: true
        additional:
          - observability

    # Component-specific namespace overrides
    kubeStateMetrics:
      namespaceOverride: "observability"

    nodeExporter:
      namespaceOverride: "observability"

    # ServiceMonitor configurations
    prometheus-node-exporter:
      namespaceOverride: "observability"

    kube-state-metrics:
      namespaceOverride: "observability"
