---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: flux-system
  labels:
    app: prometheus
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: observability
  chartRef:
    kind: OCIRepository
    name: kps-ocirepo
    namespace: flux-system

  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # kube-prometheus-stack configuration for observability namespace
    # Deploys Prometheus with OTLP, Grafana, and Thanos with local storage

    # Global namespace override
    namespaceOverride: "observability"

    # Prometheus configuration
    prometheus:
      prometheusSpec:
        # Enable OTLP receiver for OpenTelemetry metrics
        otlp:
          # https://github.com/prometheus-community/helm-charts/issues/5080
          promoteResourceAttributes:
          - service.instance.id
          - service.name
          - service.namespace
          - cloud.availability_zone
          - cloud.region
          - container.name
          - deployment.environment.name
          - k8s.cluster.name
          - k8s.container.name
          - k8s.cronjob.name
          - k8s.daemonset.name
          - k8s.deployment.name
          - k8s.job.name
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          keepIdentifyingResourceAttributes: false
          translationStrategy: NoUTF8EscapingWithSuffixes
          convertHistogramsToNHCB: false

        # Retention configuration - cap by time and size to bound PVC growth
        retention: 15d
        retentionSize: 3GB

        # TSDB configuration
        tsdb:
          outOfOrderTimeWindow: 0s
        walCompression: true

        # Thanos sidecar configuration for local storage
        thanos:
          # NOTE: do not set `image:` here — kube-prometheus-stack 84.3.0 has a
          # template bug that renders `image:` twice when this is set, causing
          # "mapping key 'image' already defined" YAML errors. The operator
          # uses its default base image (quay.io/thanos/thanos) with `version`.
          version: v0.34.1

          # Object storage configuration for local filesystem
          objectStorageConfig:
            name: thanos-objstore-config
            key: thanos.yaml

          # External labels for Thanos
          externalLabels:
            cluster: "kubespaces"
            prometheus_replica: "$(POD_NAME)"

          # Volume mounts for Thanos sidecar
          volumeMounts:
            - name: thanos-store
              mountPath: /thanos/store

        # Volumes for Thanos local storage
        volumes:
          - name: thanos-store
            persistentVolumeClaim:
              claimName: thanos-store

        # Storage configuration for Prometheus
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi

        # Additional scrape configs if needed
        additionalScrapeConfigs: []

    # Grafana configuration
    grafana:
      grafana.ini:
        server:
          root_url: https://grafana.vps.kubespaces.cloud
        security:
          allow_embedding: true
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Viewer
      enabled: true
      namespaceOverride: "observability"

      # Admin credentials
      adminPassword: "admin"  # Change this in production!

      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC

      # Datasources: provision via the grafana sub-chart's `datasources` map
      # (mounted directly via subPath at /etc/grafana/provisioning/datasources/).
      # The sidecar mode is off because:
      #   - kube-prometheus-stack's datasource ConfigMap is gated by
      #     `sidecar.datasources.enabled OR forceDeployDatasources` and
      #     consumes `additionalDataSources` only there
      #   - sidecar+emptyDir created a race where the file landed after Grafana
      #     scanned, and the reload API is blocked by Grafana 10+ RBAC
      sidecar:
        datasources:
          enabled: false

      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://observability-prometheus-s-prometheus.observability:9090/
              access: proxy
              isDefault: true
              jsonData:
                httpMethod: POST
                timeInterval: 30s
            - name: Alertmanager
              type: alertmanager
              uid: alertmanager
              url: http://observability-prometheus-s-alertmanager.observability:9093/
              access: proxy
              jsonData:
                handleGrafanaManagedAlerts: false
                implementation: prometheus
            - name: Loki
              type: loki
              uid: loki
              # Bypass logging-loki-gateway (basic-auth-protected for the
              # public endpoint) and read directly from the SimpleScalable
              # read pool. Caches are disabled in this single-node setup.
              url: http://loki-read.logging.svc.cluster.local:3100
              access: proxy
              jsonData:
                maxLines: 1000
                timeout: 60

      # Grafana ingress disabled (we'll use HTTPRoute instead)
      ingress:
        enabled: false

      # Service configuration
      service:
        type: ClusterIP
        port: 80
        targetPort: 3000

      # Persistence
      persistence:
        enabled: true
        size: 10Gi
        accessModes:
          - ReadWriteOnce

    # Alertmanager configuration
    alertmanager:
      enabled: true
      alertmanagerSpec:
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

    # Prometheus Operator configuration
    prometheusOperator:
      namespaces:
        releaseNamespace: true
        additional:
          - observability

    # Component-specific namespace overrides
    kubeStateMetrics:
      namespaceOverride: "observability"

    nodeExporter:
      namespaceOverride: "observability"

    # ServiceMonitor configurations
    prometheus-node-exporter:
      namespaceOverride: "observability"

    kube-state-metrics:
      namespaceOverride: "observability"
