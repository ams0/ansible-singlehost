---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
  labels:
    app: velero
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: velero
  chart:
    spec:
      chart: velero
      sourceRef:
        kind: HelmRepository
        name: tanzu-helm-charts
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.9.2
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      useSecret: true
      existingSecret: velero-s3-credentials

    configuration:
      backupStorageLocation:
        - name: garage
          provider: aws
          bucket: velero
          default: true
          accessMode: ReadWrite
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: http://garage-garage.garage.svc.cluster.local:3900

      volumeSnapshotLocation: []
      defaultVolumesToFsBackup: true
      uploaderType: kopia

    snapshotsEnabled: false
    deployLocalVolumeProvider: false
    deployNodeAgent: true

    nodeAgent:
      podVolumePath: /var/lib/k0s/kubelet/pods
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    schedules:
      daily-all-apps:
        disabled: false
        schedule: "0 2 * * *"
        useOwnerReferencesInBackup: false
        template:
          ttl: "336h"
          storageLocation: garage
          includedNamespaces:
            - n8n
            - forgejo
            - minecraft
            - keycloak
            - actual
            - alarik
            - uptime-kuma
            - outline
            - waha
            - rustfs
          defaultVolumesToFsBackup: true
          snapshotVolumes: false

      weekly-disaster-recovery:
        disabled: false
        schedule: "0 3 * * 0"
        useOwnerReferencesInBackup: false
        template:
          ttl: "2160h"
          storageLocation: garage
          includedNamespaces:
            - n8n
            - forgejo
            - minecraft
            - keycloak
            - actual
            - alarik
            - uptime-kuma
            - outline
            - waha
            - rustfs
          defaultVolumesToFsBackup: true
          snapshotVolumes: false
