---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: flux-system
  labels:
    app: rustfs
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: rustfs
  chart:
    spec:
      chart: rustfs
      sourceRef:
        kind: HelmRepository
        name: rustfs
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    mode:
      standalone:
        enabled: true
        existingClaim:
          dataClaim: rustfs-pvc
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs-auth
    config:
      rustfs:
        region: "eu-oracle-1"
        # The rustfs logger defaults to INFO + "development", which emits
        # tracing span enter/exit/close events for routine internal ops
        # (storage_info, rebalance) — ~30MB/hour of noise. Drop to warn +
        # production to keep only actionable log lines.
        log_level: "warn"
        obs_environment: "production"
        # Without keep_files the hourly-rotated logs are never pruned and
        # the (256Mi) logs PVC grew unbounded to 1.7G on the host fs.
        # Bound retention: keep at most 7 rotated files.
        log_rotation:
          size: 100
          time: hour
          keep_files: 7
    kms:
      enabled: false
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi