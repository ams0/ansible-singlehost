---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashy
  namespace: flux-system
  labels:
    app: dashy
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: dashy
  chart:
    spec:
      chart: dashy
      sourceRef:
        kind: HelmRepository
        name: dashy
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: lissy93/dashy
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: "latest"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    static:
      enabled: true
      existingSecret: ""
      configMapContent:
        conf: |-
          pageInfo:
            title: CloudLab
            description: Oracle Cloud ARM64 · K0s · Flux CD · Istio
            navLinks:
              - title: GitHub
                path: https://github.com/ams0/cloudlab
                icon: fab fa-github
              - title: LinkedIn
                path: https://www.linkedin.com/in/alessandrovozza
                icon: fab fa-linkedin
              - title: Grafana
                path: https://grafana.vps.kubespaces.cloud
                icon: fas fa-chart-area
              - title: Status
                path: https://uptime.vps.kubespaces.cloud
                icon: fas fa-heartbeat

          appConfig:
            theme: one-dark
            layout: auto
            iconSize: medium
            colCount: 3
            statusCheck: true
            statusCheckInterval: 300
            faviconApi: iconhorse
            defaultOpeningMethod: newtab
            showSplashScreen: false
            enableFontAwesome: true
            enableMaterialDesignIcons: true
            webSearch:
              searchEngine: duckduckgo
              openingMethod: newtab
            customCss: >-
              .home {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%) !important;
              }

          sections:
            - name: Time & Weather
              icon: fas fa-clock
              displayData:
                cols: 1
                color: '#89ddff'
              widgets:
                - type: clock
                  options:
                    timeZone: Europe/Amsterdam
                    format: en-GB
                    customCityName: Amsterdam
                    use12Hour: false
                - type: clock
                  options:
                    timeZone: America/New_York
                    format: en-US
                    customCityName: New York
                    use12Hour: true

            - name: GitHub & Dev
              icon: fab fa-github
              displayData:
                cols: 1
                color: '#c3e88d'
              widgets:
                - type: github-profile-stats
                  options:
                    username: ams0
                    hideLanguagesCard: false

            - name: Tech News
              icon: fas fa-newspaper
              displayData:
                cols: 1
                color: '#f78c6c'
              widgets:
                - type: hackernews-trending
                  options:
                    stories: beststories
                    limit: 6

            - name: Node Metrics
              icon: fas fa-chart-line
              displayData:
                cols: 3
                color: '#ffcb6b'
              widgets:
                - type: embed
                  options:
                    html: '<iframe src="https://grafana.vps.kubespaces.cloud/public-dashboards/87f59dc49d464d5a964503c89057db0e" width="100%" height="450" frameborder="0" style="border:none;border-radius:8px;"></iframe>'

            - name: Productivity
              icon: fas fa-briefcase
              displayData:
                cols: 1
                itemSize: medium
                color: '#7eb6ff'
              items:
                - title: n8n
                  description: Workflow Automation
                  url: https://n8n.vps.kubespaces.cloud
                  icon: si-n8n
                  statusCheck: true
                - title: Vikunja
                  description: Task Management
                  url: https://todo.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: XWiki
                  description: Knowledge Base
                  url: https://wiki.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: Actual Budget
                  description: Personal Finance
                  url: https://actual.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: Outline
                  description: Team Wiki & Docs
                  url: https://outline.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true

            - name: AI & Agents
              icon: fas fa-robot
              displayData:
                cols: 1
                itemSize: medium
                color: '#c792ea'
              items:
                - title: Open WebUI
                  description: AI Chat Interface
                  url: https://chat.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: OpenClaw
                  description: AI Agent Platform
                  url: https://claw.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: Supabase
                  description: Backend-as-a-Service
                  url: https://supabase.vps.kubespaces.cloud
                  icon: si-supabase
                  statusCheck: true

            - name: Development
              icon: fas fa-code
              displayData:
                cols: 1
                itemSize: medium
                color: '#c3e88d'
              items:
                - title: Forgejo
                  description: Git Repositories
                  url: https://code.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: ArgoCD
                  description: GitOps Delivery
                  url: https://argocd.vps.kubespaces.cloud
                  icon: si-argo
                  statusCheck: true
                - title: Coder
                  description: Cloud Dev Environments
                  url: https://coder.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true

            - name: Infrastructure
              icon: fas fa-server
              displayData:
                cols: 1
                itemSize: medium
                color: '#ffcb6b'
              items:
                - title: Rancher
                  description: Kubernetes Management
                  url: https://rancher.vps.kubespaces.cloud
                  icon: si-rancher
                  statusCheck: true
                - title: Omni
                  description: Talos Cluster Management
                  url: https://omni.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: Garage S3
                  description: Object Storage
                  url: https://s3.vps.kubespaces.cloud
                  icon: fas fa-database
                  statusCheck: true
                - title: RustFS Console
                  description: S3-compatible Object Storage
                  url: https://rustfs.vps.kubespaces.cloud/rustfs/console/
                  icon: fas fa-bucket
                  statusCheck: true

            - name: Observability
              icon: fas fa-eye
              displayData:
                cols: 1
                itemSize: medium
                color: '#f78c6c'
              items:
                - title: Grafana
                  description: Dashboards & Metrics
                  url: https://grafana.vps.kubespaces.cloud
                  icon: si-grafana
                  statusCheck: true
                - title: Uptime Kuma
                  description: Uptime Monitoring
                  url: https://uptime.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true

            - name: Auth & Security
              icon: fas fa-shield-alt
              displayData:
                cols: 1
                itemSize: medium
                color: '#ff5370'
              items:
                - title: Authentik
                  description: Identity Provider
                  url: https://authentik.vps.kubespaces.cloud
                  icon: favicon
                  statusCheck: true
                - title: Keycloak
                  description: IAM & SSO
                  url: https://auth.vps.kubespaces.cloud
                  icon: si-keycloak
                  statusCheck: true

            - name: Communication
              icon: fas fa-comments
              displayData:
                cols: 1
                itemSize: medium
                color: '#89ddff'
              items:
                - title: Waha
                  description: WhatsApp API Gateway
                  url: https://waha.vps.kubespaces.cloud
                  icon: si-whatsapp
                  statusCheck: true
                - title: Alarik
                  description: Notification Platform
                  url: https://alarik.vps.kubespaces.cloud
                  icon: fas fa-bell
                  statusCheck: true
                - title: Alarik Console
                  description: Alarik Management UI
                  url: https://alarik-console.vps.kubespaces.cloud
                  icon: fas fa-sliders-h
                  statusCheck: true

            - name: Other Services
              icon: fas fa-th
              displayData:
                cols: 1
                itemSize: small
                color: '#82aaff'
              items:
                - title: Dashy
                  description: This Dashboard
                  url: https://dash.vps.kubespaces.cloud
                  icon: favicon
                - title: Minecraft
                  description: Game Server
                  url: https://minecraft.vps.kubespaces.cloud
                  icon: si-minecraft
                - title: Echo Server
                  description: HTTP Debug
                  url: https://echo.vps.kubespaces.cloud
                  icon: fas fa-exchange-alt
                  statusCheck: true
                - title: Nginx
                  description: Web Server
                  url: https://nginx.vps.kubespaces.cloud
                  icon: si-nginx
                  statusCheck: true
                - title: Flux Webhook
                  description: GitOps Receiver
                  url: https://webhook.vps.kubespaces.cloud
                  icon: fas fa-satellite-dish

            - name: Quick Links
              icon: fas fa-external-link-alt
              displayData:
                cols: 1
                itemSize: small
                color: '#b2ccd6'
              items:
                - title: CloudLab Repo
                  description: Infrastructure as Code
                  url: https://github.com/ams0/cloudlab
                  icon: fab fa-github
                - title: Alessandro Vozza
                  description: LinkedIn Profile
                  url: https://www.linkedin.com/in/alessandrovozza
                  icon: fab fa-linkedin
                - title: Kubernetes Docs
                  description: K8s Reference
                  url: https://kubernetes.io/docs/
                  icon: si-kubernetes
                - title: Flux CD Docs
                  description: GitOps Toolkit
                  url: https://fluxcd.io/docs/
                  icon: favicon
                - title: CNCF Landscape
                  description: Cloud Native Ecosystem
                  url: https://landscape.cncf.io/
                  icon: favicon

            - name: Cloud Native News
              icon: fas fa-rss
              displayData:
                cols: 1
                color: '#ffcb6b'
              widgets:
                - type: rss-feed
                  options:
                    rssUrl: https://kubernetes.io/feed.xml
                    limit: 5
                    orderBy: pubDate
                    orderDirection: desc

            - name: Fun Corner
              icon: fas fa-smile
              displayData:
                cols: 1
                color: '#c792ea'
              widgets:
                - type: xkcd-comic
                  options:
                    comic: random
                - type: joke
                  options:
                    category: Programming
                    safeMode: true