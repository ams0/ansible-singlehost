---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atlantis
  namespace: flux-system
  labels:
    app: atlantis
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: atlantis
  chart:
    spec:
      chart: atlantis
      sourceRef:
        kind: HelmRepository
        name: atlantis
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "v0.36.0" # renovate: datasource=docker depName=ghcr.io/runatlantis/atlantis
    orgAllowlist: "github.com/ams0/*"
    atlantisUrl: "https://atlantis.vps.kubespaces.cloud"
    github:
      user: ams0
    vcsSecretName: atlantis-vcs
    # Chart-managed PVC (atlantis-atlantis-data) persists data across pod
    # restarts and Helm upgrades. (A standalone atlantis-pvc existingClaim was
    # removed: the chart never bound it, leaving it perpetually Pending and
    # failing the root Kustomization health check.)
    volumeClaim:
      enabled: true
    ingress:
      enabled: false
    service:
      type: ClusterIP
      port: 80
    statefulSet:
      securityContext:
        fsGroup: 1000
        runAsUser: 100
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
