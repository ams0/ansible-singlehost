---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supabase
  namespace: flux-system
  labels:
    app: supabase
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: supabase
  chart:
    spec:
      chart: supabase
      sourceRef:
        kind: HelmRepository
        name: supabase
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    environment:
      auth:
        API_EXTERNAL_URL: https://supabase.vps.kubespaces.cloud
      studio:
        SUPABASE_PUBLIC_URL: https://supabase.vps.kubespaces.cloud
    ingress:
      enabled: false
    secret:
      dashboard:
        username: "supabase"
        password: "this_password_is_insecure_and_should_be_updated"
        openAiApiKey: "key_super_secret"
    deployment:
      kong:
        enabled: true