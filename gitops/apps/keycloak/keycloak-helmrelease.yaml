
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: flux-system
  labels:
    app: keycloak
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: keycloak
  dependsOn:
    - name: keycloak-database
  chartRef:
    kind: OCIRepository
    name: keycloak-ocirepo
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    args:
      - start
    http:
      relativePath: "/"
    extraEnv: |
      - name: KC_HOSTNAME
        value: https://auth.vps.kubespaces.cloud
      - name: KC_HOSTNAME_STRICT
        value: "false"
      - name: KC_BOOTSTRAP_ADMIN_USERNAME
        valueFrom:
          secretKeyRef:
            name: keycloak-bootstrap-admin
            key: username
      - name: KC_BOOTSTRAP_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-bootstrap-admin
            key: password
      - name: KC_SMTP_HOST
        value: smtp-relay.gmail.com
      - name: KC_SMTP_PORT
        value: "587"
      - name: KC_SMTP_FROM
        value: alessandro@kubespaces.io
      - name: KC_SMTP_USER
        value: alessandro@kubespaces.io
      - name: KC_SMTP_AUTH
        value: "true"
      - name: KC_SMTP_STARTTLS
        value: "true"
      - name: KC_SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keycloak-smtp
            key: password
    database:
      existingSecret: "keycloak-keycloak-database-cluster-app"
      existingSecretKey: "password"
      # E.g. dev-file, dev-mem, mariadb, mssql, mysql, oracle or postgres
      vendor: postgres
      hostname: keycloak-keycloak-database-cluster-rw
      port: 5432
      database: keycloak
      username: keycloak
    extraVolumes: |
      - name: themes
        persistentVolumeClaim:
          claimName: keycloak-pvc
    extraVolumeMounts: |
      - name: themes
        mountPath: /opt/keycloak/themes
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1500m
        memory: 1536Mi
