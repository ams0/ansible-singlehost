
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: flux-system
  labels:
    app: keycloak
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: keycloak
  chart:
    spec:
      chartRef:
        kind: OCIRepository
        name: keycloak-ocirepo
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    database:
      existingSecret: "keycloak-keycloak-database-cluster-app"
      existingSecretKey: "password"
      # E.g. dev-file, dev-mem, mariadb, mssql, mysql, oracle or postgres
      vendor: postgres
      hostname: keycloak-keycloak-database-cluster-rw
      port: 5432
      database: keycloak
      username: keycloak
    extraVolumes: |
      - name: themes
        persistentVolumeClaim:
          claimName: keycloak-pvc
    extraVolumeMounts: |
      - name: themes
        mountPath: /opt/keycloak/themes
