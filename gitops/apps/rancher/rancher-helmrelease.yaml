---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: flux-system
  labels:
    app: rancher
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: rancher
  chart:
    spec:
      chart: rancher
      sourceRef:
        kind: HelmRepository
        name: rancher
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingress:
      enabled: false
    hostname: rancher.vps.kubespaces.cloud
    replicas: 1
    service:
      type: ClusterIP
    tls: external