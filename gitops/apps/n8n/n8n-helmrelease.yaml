---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: flux-system
  labels:
    app: n8n
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: n8n
  chartRef:
    kind: OCIRepository
    name: n8n-ocirepo
    namespace: flux-system

  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    valkey:
      enabled: true
      architecture: standalone
      replicaCount: 1
      auth:
        enabled: false
      dataStorage:
        enabled: false

    image:
      tag: "2.7.5" # renovate: datasource=docker depName=n8nio/n8n

    main:
      # Database configuration
      config:
        executions:
          mode: queue
        queue:
          bull:
            redis:
              host: n8n-n8n-valkey
        db:
          type: postgresdb
          postgresdb:
            host: n8n-n8n-database-cluster-rw
            port: 5432
            database: n8n
            user: n8n
        webhook_url: "https://n8n.vps.kubespaces.cloud"
        n8n:
          proxy_hops: "1"
          editor_base_url: "https://n8n.vps.kubespaces.cloud"

      # Reference password from secret
      extraEnv:
        DB_POSTGRESDB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: n8n-n8n-database-cluster-app
              key: password
        OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS:
          value: "true"

      # Persistence for n8n data
      persistence:
        enabled: true
        type: existing
        existingClaim: n8n-pvc

      # Service configuration
      service:
        type: ClusterIP
        port: 5678

      # Resources
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi

      # Security context - using podSecurityContext as per chart defaults
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

    worker:
      enabled: true
      replicaCount: 1
      concurrency: 10  # parallel jobs per worker
      config:
        queue:
          health:
            check:
              active: true
          bull:
            redis:
              host: n8n-n8n-valkey
              port: 6379
      extraEnv:
        DB_POSTGRESDB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: n8n-n8n-database-cluster-app
              key: password

    # Ingress configuration (disabled for now, will use Gateway API)
    ingress:
      enabled: false
