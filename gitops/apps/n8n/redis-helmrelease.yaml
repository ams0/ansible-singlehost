---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-n8n
  namespace: flux-system
  labels:
    app: redis-n8n
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: n8n
  chartRef:
    kind: OCIRepository
    name: redis-ocirepo
    namespace: flux-system

  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    auth:
      enabled: false
    persistence:
      enabled: true
      existingClaim: redis-pvc
