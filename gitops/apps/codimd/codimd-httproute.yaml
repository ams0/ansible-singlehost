---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: codimd
  namespace: codimd
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: http   # listener name on the Gateway
  hostnames:
    - "codimd.vps.kubespaces.cloud"  # Change this to your actual domain
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: codimd
          port: 18789
