---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: codimd
  namespace: flux-system
  labels:
    app: codimd
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: codimd
  chart:
    spec:
      chart: codimd
      sourceRef:
        kind: HelmRepository
        name: codimd
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    postgresql:
      enabled: false
    service:
      type: ClusterIP