---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
  namespace: flux-system
  labels:
    app: backstage
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: backstage
  chart:
    spec:
      chart: backstage
      sourceRef:
        kind: HelmRepository
        name: backstage
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    backstage:
      appConfig:
        app:
          baseUrl: https://backstage.vps.kubespaces.cloud
        backend:
          baseUrl: https://backstage.vps.kubespaces.cloud
          database:
            client: pg
            connection:
              host: backstage-backstage-database-cluster-rw
              port: 5432
              user: backstage
              password: ${POSTGRES_PASSWORD}
      extraEnvVars:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-backstage-database-cluster-app
              key: password
    ingress:
      enabled: false
    postgresql:
      enabled: false
