---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: flux-system
  labels:
    app: harbor
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: harbor
  chart:
    spec:
      chart: harbor
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    database:
      type: internal
      internal:
        image:
          repository: ams0/harbor-db
          tag: dev
    externalURL: "https://registry.vps.kubespaces.cloud"  # Change this to your actual domain
    expose:
      type: clusterIP
      tls:
        enabled: false
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          existingClaim: harbor-pvc
