---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: flux-system
  labels:
    app: vikunja
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: vikunja
  chartRef:
    kind: OCIRepository
    name: vikunja-ocirepo
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    vikunja:
      env:
        # To utilize a secret in the environment variables, you can do something like the following: https://github.com/bjw-s/helm-charts/blob/a081de53024d8328d1ae9ff7e4f6bc500b0f3a29/charts/library/common/values.yaml#L141-L145
        # You can use PostgreSQL, MySQL, or SQLite. SQLite is the default for simplicity.
        # https://vikunja.io/docs/config-options
        VIKUNJA_DATABASE_TYPE: "postgres"
        VIKUNJA_DATABASE_HOST: "vikunja-vikunja-database-cluster-rw"
        VIKUNJA_DATABASE_USER: "vikunja"
        VIKUNJA_DATABASE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: vikunja-vikunja-database-cluster-app
              key: password


      ingress:
        main:
          enabled: false
    database:
      type: postgres
      host: vikunja-vikunja-database-cluster-rw
      user: vikunja
      password:
        valueFrom:
          secretKeyRef:
            name: vikunja-vikunja-database-cluster-app
            key: password
      database: vikunja
    mailer:
      enabled: true
      host: "smtp.gmail.com"
      port: 587
      username: "alessandro@kubespaces.io"
      password:
        valueFrom:
          secretKeyRef:
            name: vikunja-vikunja-database-cluster-app
            key: mailer-password
      fromemail: "alessandro@kubespaces.io"