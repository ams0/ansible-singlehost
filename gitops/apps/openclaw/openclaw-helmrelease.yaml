---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
  namespace: flux-system
  labels:
    app: openclaw
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: openclaw
  chart:
    spec:
      chart: openclaw
      sourceRef:
        kind: HelmRepository
        name: openclaw
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ingress:
      enabled: false
    hostname: claw.vps.kubespaces.cloud
    replicas: 1
    service:
      type: ClusterIP
    tls: external