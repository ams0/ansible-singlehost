---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xwiki
  namespace: xwiki
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: http   # listener name on the Gateway
  hostnames:
    - "wiki.vps.kubespaces.cloud"  # Change this to your actual domain
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: xwiki-xwiki-xwiki
          port: 80
