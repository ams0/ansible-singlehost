---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  dependsOn:
    - name: istio-base
      namespace: flux-system
  chart:
    spec:
      chart: istiod
      version: "1.30.0"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 1h
  targetNamespace: istio-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: istiod
  values:
    profile: ambient
    pilot:
      # Single-node cluster: the node lacks CPU headroom to run two istiod
      # pods at once. Default rolling-update surge keeps the old pod while
      # scheduling the new one, which stays Pending (Insufficient cpu) until
      # the 10m timeout and the upgrade fails. Remove the old pod first so
      # the new one fits. Brief istiod (control-plane) blip on upgrade; the
      # ambient data plane (ztunnel) keeps forwarding with last-known config.
      rollingMaxSurge: 0
      rollingMaxUnavailable: 1
    meshConfig:
      accessLogFile: /dev/stdout
      defaultConfig:
        gatewayTopology:
          numTrustedProxies: 1
