name: Deploy with Ansible

# Automatic triggers disabled: the target VM/cluster were destroyed.
# Re-enable the push/schedule triggers below once infrastructure is provisioned again.
on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'ingress/**'
  #     - 'roles/**'
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Ansible tags to run (comma-separated, leave empty for all)'
        required: false
        default: ''
      limit:
        description: 'Limit to specific hosts (leave empty for all)'
        required: false
        default: ''

concurrency:
  group: deploy-with-ansible
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Ansible and dependencies
        run: |
          pip install ansible
          ansible-galaxy install -r requirements.yml

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ANSIBLE_HOST }} >> ~/.ssh/known_hosts

      - name: Create inventory file
        run: |
          cat > inventory.ini << EOF
          [oracle_hosts]
          oracle-server ansible_host=${{ secrets.ANSIBLE_HOST }} ansible_user=${{ secrets.ANSIBLE_USER }} ansible_ssh_private_key_file=~/.ssh/id_rsa
          EOF

      - name: Create Ansible vault password file
        run: |
          # Trim whitespace and create password file
          echo -n "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" | tr -d '[:space:]' > .vault_password
          chmod 600 .vault_password

      - name: Test vault decryption
        run: |
          if ansible-vault view group_vars/oracle_hosts/vault.yml --vault-password-file .vault_password > /dev/null 2>&1; then
            echo "✓ Vault decryption successful"
          else
            echo "ERROR: Failed to decrypt vault file"
            exit 1
          fi

      - name: Run Ansible playbook
        env:
          ANSIBLE_TAGS: ${{ github.event.inputs.tags }}
          ANSIBLE_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ANSIBLE_OPTS=""

          if [ -n "$ANSIBLE_TAGS" ]; then
            ANSIBLE_OPTS="$ANSIBLE_OPTS --tags $ANSIBLE_TAGS"
          fi

          if [ -n "$ANSIBLE_LIMIT" ]; then
            ANSIBLE_OPTS="$ANSIBLE_OPTS --limit $ANSIBLE_LIMIT"
          fi

          ansible-playbook site.yml $ANSIBLE_OPTS

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f .vault_password
          rm -f inventory.ini
