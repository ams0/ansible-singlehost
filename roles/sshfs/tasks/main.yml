---
- name: Install cifs-utils
  apt:
    name: cifs-utils
    state: present
    update_cache: yes

- name: Create SMB credentials file
  copy:
    dest: /etc/smb-credentials-{{ item.name }}
    content: |
      username={{ item.username }}
      password={{ smb_password }}
    mode: "0600"
  loop: "{{ smb_mounts }}"
  no_log: true

- name: Create mount points
  file:
    path: "{{ item.local_path }}"
    state: directory
    mode: "0755"
  loop: "{{ smb_mounts }}"

- name: Deploy systemd mount units
  template:
    src: smb.mount.j2
    dest: "/etc/systemd/system/{{ item.local_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    mode: "0644"
  loop: "{{ smb_mounts }}"
  notify: reload systemd

- name: Deploy systemd automount units
  template:
    src: smb.automount.j2
    dest: "/etc/systemd/system/{{ item.local_path | regex_replace('^/', '') | regex_replace('/', '-') }}.automount"
    mode: "0644"
  loop: "{{ smb_mounts }}"
  notify: reload systemd

- name: Flush handlers
  meta: flush_handlers

- name: Enable and start automount units
  systemd:
    name: "{{ item.local_path | regex_replace('^/', '') | regex_replace('/', '-') }}.automount"
    enabled: yes
    state: started
  loop: "{{ smb_mounts }}"
