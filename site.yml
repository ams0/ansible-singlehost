---
- name: Configure Oracle Host
  hosts: oracle_hosts
  become: yes
  gather_facts: yes
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 600
      update_cache_retries: 5
      update_cache_retry_max_delay: 30
    ansible.builtin.apt_repository:
      update_cache_retries: 5
      update_cache_retry_max_delay: 30
  
  roles:
    - role: common
      tags: [common, always]
    - role: packages
      tags: [packages]
    - role: fail2ban
      tags: [fail2ban, security]
    - role: cron
      tags: [cron]
    - role: docker
      tags: [docker]
    - role: traefik
      tags: [traefik, ingress]
    - role: tailscale
      tags: [tailscale]
    - role: sshfs
      tags: [sshfs, backup]
    - role: borg
      tags: [borg, backup]
    - role: datadog
      tags: [datadog, monitoring]
    - role: k0s
      tags: [k0s, kubernetes]
    - role: flux
      tags: [flux, gitops]
    - role: flux-webhook
      tags: [flux-webhook, gitops]
    - role: claude-code
      tags: [claude-code, tools]

  tasks:
    - name: Display host information
      debug:
        msg: "Successfully configured {{ inventory_hostname }} ({{ ansible_default_ipv4.address }})"
